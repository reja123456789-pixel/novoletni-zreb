<script>
// =====================================================================
//  GLAVA HERO — ritmična mini igra za telefon
//  Bonbončki letijo iz ust, dolge bež črte iz nosu.
//  Ena težavnost: več točk imaš, težje je.
// =====================================================================

const cv = document.getElementById('c');
const wrap = document.getElementById('wrap');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio || 1);
const TAU = Math.PI * 2;
const INK = '#1b1036';
const IS_TOUCH = matchMedia('(pointer: coarse)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

const PILL = ['#ff7ac8', '#7af0ff', '#c8ff6b'];
const SYMBOLS = ['heart', 'smile', 'star'];
const TAIL = '#f3e6cc';
const LANE_KEYS = ['A', 'S', 'D'];
const KEYMAP = {
  KeyA: 0, KeyJ: 0, ArrowLeft: 0, Digit1: 0,
  KeyS: 1, KeyK: 1, ArrowDown: 1, ArrowUp: 1, Digit2: 1,
  KeyD: 2, KeyL: 2, ArrowRight: 2, Digit3: 2,
};

const WIN = { perfect: 0.05, good: 0.095, ok: 0.14 };
const HOLD_PTS = 120;

// ---------------------------------------------------------------- postavitev (pokončno / ležeče)

let W = 960, H = 540, L = {};
function layout() {
  // ena stran je fiksna, druga se raztegne na razmerje zaslona (brez črnih robov)
  const portrait = innerHeight > innerWidth * 1.05;
  const ratio = Math.max(innerWidth, innerHeight) / Math.max(1, Math.min(innerWidth, innerHeight));
  const long = Math.round(clamp(540 * ratio, 860, 1200));
  W = portrait ? 540 : long;
  H = portrait ? long : 540;
  L = portrait
    ? { portrait, CX: 270, HIT_Y: H - 180, FAR_Y: 318, NEAR: 228, HEAD_Y: 192, HEAD_S: 1.08 }
    : { portrait, CX: W / 2, HIT_Y: 462, FAR_Y: 205, NEAR: 195, HEAD_Y: 118, HEAD_S: 0.92 };
  cv.width = W * DPR;
  cv.height = H * DPR;
  const s = Math.min(innerWidth / W, innerHeight / H);
  wrap.style.width = W * s + 'px';
  wrap.style.height = H * s + 'px';
}
layout();
addEventListener('resize', layout);

const K = 3;
const persp = z => 1 / (1 + z * K);
const pFar = persp(1);
const projY = z => L.FAR_Y + (L.HIT_Y - L.FAR_Y) * (persp(z) - pFar) / (1 - pFar);
const halfW = z => L.NEAR * persp(z);
const laneW = z => 2 * halfW(z) / 3;
const laneX = (lane, z) => L.CX + (lane - 1) * laneW(z);

// ---------------------------------------------------------------- glasba

// tempo je spremenljiv: vgrajena pesem 120 BPM, lastna pesem po analizi
let BPM = 120, BEAT = 60 / BPM, STEP = BEAT / 2, BAR = BEAT * 4, PHASE = 0;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [
  { root: 45, pad: [57, 60, 64] }, // Am
  { root: 41, pad: [53, 57, 60] }, // F
  { root: 48, pad: [55, 60, 64] }, // C
  { root: 43, pad: [55, 59, 62] }, // G
];
const chordFor = bar => CHORDS[((bar - 2) % 4 + 4) % 4];
const INTRO = 2, MAIN = 48, OUTRO = 2;
let TOTAL = INTRO + MAIN + OUTRO;

const RHY = {
  q:    [[0, 2], [2, 2], [4, 2], [6, 2]],
  hq:   [[0, 4], [4, 2], [6, 2]],
  qh:   [[0, 2], [2, 2], [4, 4]],
  w:    [[0, 8]],
  e1:   [[0, 1], [1, 1], [2, 2], [4, 1], [5, 1], [6, 2]],
  syn:  [[0, 3], [3, 3], [6, 2]],
  run:  [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1]],
  s16:  [[0, 1], [1, 0.5], [1.5, 0.5], [2, 2], [4, 1], [5, 1], [6, 0.5], [6.5, 0.5], [7, 1]],
  s16b: [[0, 0.5], [0.5, 0.5], [1, 1], [2, 0.5], [2.5, 0.5], [3, 1], [4, 0.5], [4.5, 0.5], [5, 0.5], [5.5, 0.5], [6, 2]],
};

// več točk → hitrejši bonbončki, gostejši ritmi, več dvojnih — in bolj zadet možiček
const LEVELS = [
  { score: 0,     lead: 2.0,  pool: ['q', 'hq', 'w', 'qh'],         chord: 0 },
  { score: 6000,  lead: 1.75, pool: ['q', 'hq', 'qh', 'e1'],        chord: 0.05 },
  { score: 18000, lead: 1.55, pool: ['e1', 'syn', 'q', 'hq'],       chord: 0.12 },
  { score: 38000, lead: 1.35, pool: ['run', 's16', 'syn', 'e1'],    chord: 0.2 },
  { score: 65000, lead: 1.18, pool: ['s16', 'run', 's16b', 'syn'],  chord: 0.3 },
];
const AFTA_LEVEL = 3; // prehod 3 → 4: injekcija + AFTA PARTY

function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------------------------------------------------------------- zvok

let AC = null, master = null, noiseBuf = null, muted = false;

function audioInit() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain();
      master.gain.value = muted ? 0 : 0.9;
      master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch { AC = null; }
  }
  if (AC && AC.state === 'suspended' && state !== 'paused') AC.resume();
}
function setMuted(m) {
  muted = m;
  if (master) master.gain.value = m ? 0 : 0.9;
}
function playTone(at, f, d, type, vol, attack = 0.005, filter = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(vol, at + attack);
  g.gain.setValueAtTime(vol, at + Math.max(attack, d * 0.6));
  g.gain.exponentialRampToValueAtTime(0.0001, at + d);
  let node = o;
  if (filter) {
    const lp = AC.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = filter;
    o.connect(lp); node = lp;
  }
  node.connect(g).connect(master);
  o.start(at); o.stop(at + d + 0.05);
}
function playNoise(at, d, vol, type, freq) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + d);
  s.connect(f).connect(g).connect(master);
  s.start(at, Math.random() * 0.5, d + 0.05);
}
function playEvent(ev, at) {
  switch (ev.k) {
    case 'hat': playNoise(at, 0.04, ev.v, 'highpass', 7500); break;
    case 'kick': {
      const o = AC.createOscillator(), g = AC.createGain();
      o.frequency.setValueAtTime(150, at);
      o.frequency.exponentialRampToValueAtTime(40, at + 0.14);
      g.gain.setValueAtTime(0.7, at);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
      o.connect(g).connect(master);
      o.start(at); o.stop(at + 0.25);
      break;
    }
    case 'snare':
      playNoise(at, 0.14, ev.v || 0.28, 'bandpass', 1800);
      playTone(at, 190, 0.08, 'triangle', 0.14);
      break;
    case 'crash': playNoise(at, 1.3, 0.18, 'highpass', 4500); break;
    case 'bass': playTone(at, ev.f, ev.d, 'sawtooth', 0.11, 0.005, 520); break;
    case 'pad': for (const f of ev.fs) playTone(at, f, ev.d, 'triangle', 0.028, 0.08); break;
  }
}
function leadVoice(freq) {
  const at = AC.currentTime;
  const o = AC.createOscillator(), lfo = AC.createOscillator(), lg = AC.createGain();
  const lp = AC.createBiquadFilter(), g = AC.createGain();
  o.type = 'square'; o.frequency.value = freq;
  lfo.frequency.value = 5.5; lg.gain.value = freq * 0.008;
  lfo.connect(lg).connect(o.frequency);
  lp.type = 'lowpass'; lp.frequency.value = 2600;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(0.085, at + 0.01);
  o.connect(lp).connect(g).connect(master);
  o.start(at); lfo.start(at);
  return { o, lfo, g };
}
function stopVoice(v, delay = 0, rel = 0.08) {
  if (!v || !AC) return;
  const at = AC.currentTime + delay;
  v.g.gain.cancelScheduledValues(at);
  v.g.gain.setValueAtTime(v.g.gain.value || 0.085, at);
  v.g.gain.linearRampToValueAtTime(0.0001, at + rel);
  v.o.stop(at + rel + 0.02);
  v.lfo.stop(at + rel + 0.02);
}
function clunk() {
  if (!AC) return;
  const at = AC.currentTime;
  playNoise(at, 0.12, 0.25, 'lowpass', 400);
  playTone(at, 98, 0.15, 'sawtooth', 0.07, 0.003, 600);
}
function uiBeep(f = 660) {
  if (AC) playTone(AC.currentTime, f, 0.08, 'square', 0.06);
}
function buzz(ms) {
  if (IS_TOUCH && navigator.vibrate) try { navigator.vibrate(ms); } catch { }
}

// ---------------------------------------------------------------- stanje

let state = 'title'; // title | play | paused | results
let notes = [], backing = [], bIdx = 0, gen = null, songStart = 0;
let scoreF = 0, streak = 0, maxStreak = 0, hits = 0, misses = 0, levelIdx = 0, viewLead = LEVELS[0].lead;
let laneDown = [false, false, false], laneFlash = [0, 0, 0];
let laughUntil = -1, judge = null, banner = null, particles = [], uiButtons = [];
let cut = null; // animacija injekcije: { t0, squirted, crazy }
let clockOverride = null, lastT = 0, frame = 0;
let SONG_END = TOTAL * BAR + 0.5;
let FIRST_NOTE = INTRO * BAR;

const mult = () => Math.min(4, 1 + Math.floor(streak / 10));

function songTime() {
  if (clockOverride !== null) return clockOverride;
  if (!AC) return lastT;
  return AC.currentTime - songStart - (AC.outputLatency || AC.baseLatency || 0);
}

// ---------------------------------------------------------------- generator pesmi (sproti, glede na nivo)

function makePhrase(lv) {
  const g = gen, bars = [];
  for (let k = 0; k < 4; k++) {
    const rhy = k === 3 && g.rnd() < 0.4 ? 'hq' : lv.pool[Math.floor(g.rnd() * lv.pool.length)];
    const evs = [];
    for (const [step, len] of RHY[rhy]) {
      let nxt;
      do { nxt = clamp(g.cur + [-1, -1, 0, 1, 1, 2, -2][Math.floor(g.rnd() * 7)], 0, 2); }
      while (nxt === g.cur && g.same >= 1);
      g.same = nxt === g.cur ? g.same + 1 : 0;
      g.cur = nxt;
      evs.push({ step, len, lane: nxt });
    }
    bars.push(evs);
  }
  return bars;
}

function addRaw(t, lane, dur, lv, freq) {
  if (t < gen.laneBusy[lane] + 0.08) return; // v progi še teče dolga črta
  // dve dolgi črti nikoli ne prideta ena za drugo — druga postane bonbonček
  let hold = dur > 0;
  if (hold && t < gen.lastHoldEnd + BEAT * 1.5) hold = false;
  if (!hold) dur = 0;
  else { gen.lastHoldEnd = t + dur; gen.laneBusy[lane] = t + dur; }
  notes.push({
    t, lane, hold, dur, freq, lead: lv.lead,
    state: 'pending', spawned: false, heldTo: 0, voice: null, spin: rand(0, TAU),
  });
}

function addNote(t, lane, len, lv, ch) {
  addRaw(t, lane, len >= 3 ? len * STEP - STEP * 0.6 : 0, lv, mtof(ch.pad[lane] + 12));
}

// ---------------------------------------------------------------- lastna pesem: analiza in note

// po nivojih: mreža (1 = šestnajstinke, 2 = osminke, 4 = četrtinke), prag moči, najmanjši razmik, največ not na takt
const CUSTOM_LV = [
  { grid: 4, thr: 0.62, gap: 0.45, max: 4 },
  { grid: 2, thr: 0.52, gap: 0.30, max: 6 },
  { grid: 2, thr: 0.44, gap: 0.24, max: 6 },
  { grid: 1, thr: 0.42, gap: 0.20, max: 6 },
  { grid: 1, thr: 0.38, gap: 0.18, max: 7 },
];
// kdaj zvok šteje kot "zadržan" (dolga črta): glasnost nad deležem vrha, brez novega močnega udarca
let SUS_LEVEL = 0.45, SUS_FLUX = 1.0;
let custom = null; // { name, buffer, bpm, phase, bars, firstBar, str[3][slot], sus[3][slot] }
let musicSrc = null, musicFilter = null;
let loading = null; // { text, pct }

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = 'audio/*';
fileInput.style.display = 'none';
document.body.appendChild(fileInput);
fileInput.addEventListener('change', async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = '';
  if (!file) return;
  audioInit();
  state = 'loading';
  loading = { text: 'Berem pesem …', pct: 0 };
  try {
    const arr = await file.arrayBuffer();
    loading.text = 'Dekodiram …';
    const buffer = await new Promise((res, rej) => AC.decodeAudioData(arr, res, rej));
    if (buffer.duration < 20) throw new Error('Pesem je prekratka (vsaj 20 s).');
    loading.text = 'Iščem ritem …';
    custom = await analyzeSong(buffer, p => { loading.pct = p; });
    custom.name = file.name.replace(/\.[^.]+$/, '').slice(0, 40);
    custom.levelBars = autoLevelBars(custom);
    state = 'title';
    uiBeep(880);
  } catch (e) {
    custom = null;
    state = 'title';
    showBanner('Pesmi ni bilo mogoče prebrati 😕', '#ff5b5b');
    banner.onTitle = true;
    console.error(e);
  }
  loading = null;
});

const nextFrame = () => new Promise(r => setTimeout(r, 0));

// EDINA PESEM: naloži se sama ob odprtju igre.
// levelBars = takti, kjer se začne nivo 1–5 (po analizi pesmi: drop v taktu 62 = AFTA PARTY).
// Testna verzija (glava-hero-test.html) ne nalaga MP3-ja, ampak igra vgrajeno glasbo.
// Ustvari jo: node dev/make-test.js
const TEST_VERSION = true;

const SONG = {
  url: 'autotune.mp3',
  name: 'Zoran Šumadinac – Autotune',
  levelBars: [2, 18, 38, 62, 72],
};
let songError = null;

async function loadDefaultSong() {
  state = 'loading';
  loading = { text: 'Nalagam pesem …', pct: 0 };
  try {
    const res = await fetch(SONG.url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const total = +res.headers.get('content-length') || 0;
    let arr;
    if (total && res.body && res.body.getReader) {
      const reader = res.body.getReader(), chunks = [];
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value); got += value.length;
        loading.pct = 0.7 * got / total;
      }
      const all = new Uint8Array(got);
      let o = 0;
      for (const c of chunks) { all.set(c, o); o += c.length; }
      arr = all.buffer;
    } else {
      arr = await res.arrayBuffer();
    }
    if (!AC) audioInit();
    loading.text = 'Dekodiram …';
    const buffer = await new Promise((ok, bad) => AC.decodeAudioData(arr, ok, bad));
    loading.text = 'Glava posluša ritem …';
    custom = await analyzeSong(buffer, p => { loading.pct = 0.7 + 0.3 * p; });
    custom.name = SONG.name;
    custom.levelBars = SONG.levelBars.map(b => Math.min(b, custom.bars - 3));
  } catch (e) {
    console.warn('Pesmi ni bilo mogoče naložiti:', e);
    songError = location.protocol === 'file:'
      ? 'Odpri igro prek strežnika (ne z dvoklikom) ali izberi pesem ročno.'
      : 'Pesmi ni bilo mogoče naložiti. Izberi jo ročno.';
  }
  loading = null;
  state = 'title';
}

async function analyzeSong(buffer, onProgress) {
  const SR = 22050, HOP = 256, hopT = HOP / SR;
  const len = Math.ceil(buffer.duration * SR);
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const bands = [['lowpass', 160, 0.7], ['bandpass', 1000, 0.6], ['highpass', 4000, 0.7]]; // bas · sredina · visoki
  const env = [];
  for (let bi = 0; bi < 3; bi++) {
    const [type, freq, q] = bands[bi];
    const oac = new OAC(1, len, SR);
    const src = oac.createBufferSource();
    src.buffer = buffer;
    const flt = oac.createBiquadFilter();
    flt.type = type; flt.frequency.value = freq; flt.Q.value = q;
    src.connect(flt).connect(oac.destination);
    src.start();
    const data = (await oac.startRendering()).getChannelData(0);
    const n = Math.floor(data.length / HOP), e = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0;
      const o = i * HOP;
      for (let j = 0; j < HOP; j++) { const v = data[o + j]; s += v * v; }
      e[i] = Math.sqrt(s / HOP);
    }
    env.push(e);
    onProgress((bi + 1) / 4);
    await nextFrame();
  }
  const n = env[0].length;

  // onset = rast glasnosti (log), normalizirano na 97. percentil
  const flux = env.map(e => {
    const f = new Float32Array(n);
    let prev = 0;
    for (let i = 0; i < n; i++) {
      const v = Math.log1p(e[i] * 100);
      f[i] = Math.max(0, v - prev);
      prev = v;
    }
    const sorted = Array.from(f).filter(x => x > 0).sort((a, b) => a - b);
    const p = sorted[Math.floor(sorted.length * 0.97)] || 1;
    for (let i = 0; i < n; i++) f[i] /= p;
    return f;
  });
  const O = new Float32Array(n);
  for (let i = 0; i < n; i++) O[i] = flux[0][i] * 1.2 + flux[1][i] + flux[2][i] * 0.8;

  // tempo: avtokorelacija, z rahlo prednostjo okoli 120 BPM
  let bestLag = 0, bestScore = -1;
  const lagMin = Math.floor(60 / 180 / hopT), lagMax = Math.ceil(60 / 70 / hopT);
  const ac = [];
  for (let lag = lagMin; lag <= lagMax; lag++) {
    let s = 0;
    for (let i = 0; i + lag < n; i++) s += O[i] * O[i + lag];
    const bpm = 60 / (lag * hopT);
    const w = Math.exp(-0.5 * Math.pow(Math.log2(bpm / 120) / 0.6, 2));
    ac[lag] = s;
    if (s * w > bestScore) { bestScore = s * w; bestLag = lag; }
  }
  // natančneje s parabolično interpolacijo
  let lag = bestLag;
  if (ac[bestLag - 1] !== undefined && ac[bestLag + 1] !== undefined) {
    const a = ac[bestLag - 1], b = ac[bestLag], c = ac[bestLag + 1];
    const d = (a - 2 * b + c);
    if (d < 0) lag = bestLag + 0.5 * (a - c) / d;
  }
  onProgress(0.8);
  await nextFrame();

  // fino: tempo ±2 % in faza hkrati, da se mreža ne "zamakne" proti koncu pesmi
  const Oat = x => {
    const i = Math.floor(x), f = x - i;
    return (O[i] || 0) * (1 - f) + (O[i + 1] || 0) * f;
  };
  let bestPh = 0, bestPhScore = -1, fineLag = lag;
  for (let li = -20; li <= 20; li++) {
    const lg = lag * (1 + li * 0.001);
    for (let p = 0; p < lg; p += 0.5) {
      let s = 0;
      for (let x = p; x < n - 1; x += lg) s += Oat(x) + 0.5 * (Oat(x - 1) + Oat(x + 1));
      if (s > bestPhScore) { bestPhScore = s; bestPh = p; fineLag = lg; }
    }
  }
  const beat = fineLag * hopT;
  const phase = (bestPh + 0.5) * hopT;

  // moč vsake šestnajstinke po pasovih + dolžina zadržanega tona
  const q = beat / 4;
  const slots = Math.floor((buffer.duration - phase) / q);
  const mk = () => [new Float32Array(slots), new Float32Array(slots), new Float32Array(slots)];
  const str = mk(), sus = mk(), tOn = mk(); // tOn = točen čas udarca (ne le mreža)
  for (let s = 0; s < slots; s++) {
    const fc = Math.round((phase + s * q) / hopT);
    for (let b = 0; b < 3; b++) {
      let m = 0, mi = fc;
      for (let i = fc - 3; i <= fc + 3; i++) if (i >= 0 && i < n && flux[b][i] > m) { m = flux[b][i]; mi = i; }
      str[b][s] = m;
      tOn[b][s] = (mi + 0.5) * hopT;
      if (m > 0.3) {
        const e = env[b];
        let peak = 0;
        for (let i = fc; i < fc + 4 && i < n; i++) peak = Math.max(peak, e[i]);
        let i = fc + 4;
        const maxI = fc + Math.round(beat * 4 / hopT);
        while (i < n && i < maxI && e[i] > peak * SUS_LEVEL && flux[b][i] < SUS_FLUX) i++;
        sus[b][s] = (i - fc) * hopT;
      }
    }
  }
  onProgress(1);
  const bars = Math.floor(slots / 16);
  return {
    buffer, bpm: 60 / beat, phase, bars, str, sus, tOn,
    firstBar: Math.max(0, Math.ceil((3 - phase) / (beat * 4))),
  };
}

function genBarCustom() {
  const b = gen.bar++;
  if (b < custom.firstBar || b >= TOTAL - 1) return;
  if (gen.rest > 0) { gen.rest--; return; }
  const li = levelForBar(b), lv = LEVELS[li], C = CUSTOM_LV[li];
  const t0 = PHASE + b * BAR, q = BEAT / 4;
  const cands = [];
  for (let s = 0; s < 16; s += C.grid) {
    const idx = b * 16 + s;
    const st = [custom.str[0][idx], custom.str[1][idx], custom.str[2][idx]];
    let lane = 0;
    for (let l = 1; l < 3; l++) if (st[l] > st[lane]) lane = l;
    if (st[lane] < C.thr) continue;
    cands.push({ t: custom.tOn[lane][idx] || t0 + s * q, lane, m: st[lane], st, idx });
  }
  // najmočnejši udarci prvi, z razmikom
  cands.sort((a, c) => c.m - a.m);
  const chosen = [];
  for (const c of cands) {
    if (chosen.length >= C.max) break;
    if (chosen.every(o => Math.abs(o.t - c.t) >= C.gap)) chosen.push(c);
  }
  chosen.sort((a, c) => a.t - c.t);
  for (const c of chosen) {
    // isto progo največ 3× zapored
    if (gen.prevLanes.length >= 2 && gen.prevLanes.every(l => l === c.lane)) {
      const alt = [0, 1, 2].filter(l => l !== c.lane).sort((a, d) => c.st[d] - c.st[a])[0];
      c.lane = alt;
    }
    // če kateri pas zadrži ton (vokal, synth), postane dolga črta v tisti progi
    let dur = 0;
    if (li >= 1) {
      let sb = -1;
      for (let b = 0; b < 3; b++) {
        if (custom.sus[b][c.idx] >= 0.55 && c.st[b] >= C.thr * 0.7 && (sb < 0 || custom.sus[b][c.idx] > custom.sus[sb][c.idx])) sb = b;
      }
      if (sb >= 0) { c.lane = sb; dur = Math.min(custom.sus[sb][c.idx], BAR) - 0.1; }
    }
    gen.prevLanes = [...gen.prevLanes.slice(-1), c.lane];
    addRaw(c.t, c.lane, dur, lv, null);
    const other = [0, 1, 2].filter(l => l !== c.lane).sort((a, d) => c.st[d] - c.st[a])[0];
    if (dur === 0 && c.st[other] > C.thr + 0.3 && gen.rnd() < lv.chord * 2) addRaw(c.t, other, 0, lv, null);
  }
}

// vgrajena pesem (testna verzija): 52 taktov, nivo vsakih 10 taktov (20 s)
const BUILTIN_LEVEL_BARS = [2, 12, 22, 32, 42];
const activeLevelBars = () => custom ? custom.levelBars : BUILTIN_LEVEL_BARS;

function levelForBar(b) {
  const lb = activeLevelBars();
  if (!lb) return levelIdx;
  let i = 0;
  while (i + 1 < lb.length && b >= lb[i + 1]) i++;
  return i;
}

// za poljubno pesem: enakomerno razdeli pesem na 5 nivojev
function autoLevelBars(c) {
  const first = c.firstBar, span = c.bars - 2 - first;
  return [0, 1, 2, 3, 4].map(i => first + Math.round(span * i / 5));
}

function setupTempo() {
  if (custom) {
    BPM = custom.bpm; BEAT = 60 / BPM; STEP = BEAT / 2; BAR = BEAT * 4; PHASE = custom.phase;
    TOTAL = custom.bars;
    SONG_END = custom.buffer.duration + 0.3;
    FIRST_NOTE = PHASE + custom.firstBar * BAR;
  } else {
    BPM = 120; BEAT = 0.5; STEP = 0.25; BAR = 2; PHASE = 0;
    TOTAL = INTRO + MAIN + OUTRO;
    SONG_END = TOTAL * BAR + 0.5;
    FIRST_NOTE = INTRO * BAR;
  }
}

function stopMusic() {
  if (musicSrc) { try { musicSrc.stop(); } catch { } musicSrc.disconnect(); musicSrc = null; }
  musicFilter = null;
}

// ob zgrešeni noti glasba za trenutek zveni pridušeno (kot v Guitar Hero)
function muffle() {
  if (!musicFilter || !AC) return;
  const f = musicFilter.frequency, now = AC.currentTime;
  f.cancelScheduledValues(now);
  f.setTargetAtTime(450, now, 0.015);
  f.setTargetAtTime(20000, now + 0.3, 0.12);
}

function genBar() {
  const b = gen.bar++, t0 = b * BAR, ch = chordFor(b), li = levelForBar(b), lv = LEVELS[li];
  const intro = b < INTRO, evs = [];

  if (b === TOTAL - 1) {
    evs.push({ t: t0, k: 'crash' }, { t: t0, k: 'kick' }, { t: t0, k: 'bass', f: mtof(45), d: BAR });
    evs.push({ t: t0, k: 'pad', fs: CHORDS[0].pad.map(mtof), d: BAR * 1.5 });
    backing.push(...evs);
    return;
  }
  for (let s = 0; s < 8; s++) {
    const t = t0 + s * STEP;
    if (!(intro && b === 0 && s % 2)) evs.push({ t, k: 'hat', v: s % 2 ? 0.04 : 0.07 });
    if (li >= 3 && !intro) evs.push({ t: t + STEP / 2, k: 'hat', v: 0.03 });
    if (s === 0 || s === 4 || (li >= 1 && !intro && s === 7) || (li >= 4 && s === 3)) evs.push({ t, k: 'kick' });
    if (!intro && (s === 2 || s === 6)) evs.push({ t, k: 'snare' });
    if (intro && b === 1 && s >= 4) evs.push({ t, k: 'snare', v: 0.12 + (s - 4) * 0.05 });
    if (!intro) evs.push({ t, k: 'bass', f: mtof(ch.root + (li >= 2 && s % 2 ? 12 : 0)), d: STEP * 0.8 });
    else if (s === 0) evs.push({ t, k: 'bass', f: mtof(ch.root), d: BAR * 0.95 });
  }
  if (!intro) evs.push({ t: t0, k: 'pad', fs: ch.pad.map(mtof), d: BAR });
  if (!intro && (b - INTRO) % 8 === 0) evs.push({ t: t0, k: 'crash' });
  evs.sort((a, c) => a.t - c.t);
  backing.push(...evs);

  if (intro) return;
  if (gen.rest > 0) { gen.rest--; return; } // premor med injekcijo
  if (b === TOTAL - 2) { addNote(t0, 0, 8, lv, ch); return; } // zadnja dolga črta

  const k = (b - INTRO) % 8;
  if (k === 0 || !gen.phrase) gen.phrase = makePhrase(lv);
  else if (k === 4 && gen.rnd() < 0.45) gen.phrase = makePhrase(lv);
  if (k === 7) { addNote(t0, gen.cur, 8, lv, ch); return; } // konec fraze

  for (const ev of gen.phrase[k % 4]) {
    const t = t0 + ev.step * STEP;
    addNote(t, ev.lane, ev.len, lv, ch);
    if (ev.len < 3 && ev.step % 2 === 0 && gen.rnd() < lv.chord) {
      const l2 = ev.lane === 1 ? (gen.rnd() < 0.5 ? 0 : 2) : ev.lane === 0 ? 2 : 0;
      addNote(t, l2, ev.len, lv, ch);
    }
  }
}

// ---------------------------------------------------------------- igra

function startSong() {
  audioInit();
  if (IS_TOUCH && document.fullscreenEnabled && !document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => { });
  }
  notes = []; backing = []; bIdx = 0;
  setupTempo();
  stopMusic();
  gen = {
    bar: 0, cur: 1, same: 0, phrase: null, lastHoldEnd: -99, rest: 0,
    laneBusy: [-99, -99, -99], prevLanes: [], rnd: mulberry32((Math.random() * 1e9) | 0),
  };
  cut = null;
  scoreF = 0; streak = 0; maxStreak = 0; hits = 0; misses = 0; levelIdx = 0; viewLead = LEVELS[0].lead;
  laneDown = [false, false, false]; laneFlash = [0, 0, 0];
  laughUntil = -1; judge = null; banner = null; particles = []; lastT = 0; submitState = null;
  songStart = AC ? AC.currentTime + 0.3 : 0;
  if (custom && AC && clockOverride === null) {
    musicSrc = AC.createBufferSource();
    musicSrc.buffer = custom.buffer;
    musicFilter = AC.createBiquadFilter();
    musicFilter.type = 'lowpass';
    musicFilter.frequency.value = 20000;
    musicSrc.connect(musicFilter).connect(master);
    musicSrc.start(songStart);
  }
  state = 'play';
}

function stopAllVoices() {
  for (const n of notes) if (n.voice) { stopVoice(n.voice); n.voice = null; }
}
function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  for (let i = 0; i < 3; i++) if (laneDown[i]) laneRelease(i, songTime());
  stopAllVoices();
  if (AC) AC.suspend();
}
function resumeGame() {
  if (state !== 'paused') return;
  state = 'play';
  if (AC) AC.resume();
}
function quitToTitle() {
  stopAllVoices();
  stopMusic();
  if (AC) {
    if (AC.state === 'suspended') AC.resume();
    const old = master;
    old.gain.setValueAtTime(0, AC.currentTime);
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(AC.destination);
    setTimeout(() => old.disconnect(), 100);
  }
  state = 'title';
}
function finish() {
  stopAllVoices();
  stopMusic();
  state = 'results';
  submitScore();
  uiBeep(784);
}

function showJudge(text, color) { judge = { text, color, at: performance.now() }; }
function showBanner(text, color) { banner = { text, color, at: performance.now() }; }

function registerMiss(t) {
  if (streak >= 10) showBanner('NIZ PREKINJEN!', '#ff5b5b');
  streak = 0;
  laughUntil = t + 0.7;
  clunk();
  muffle();
  buzz(40);
}

function burst(lane, color, n = 14) {
  const x = laneX(lane, 0), y = L.HIT_Y;
  for (let i = 0; i < n; i++) {
    const a = rand(-Math.PI, 0), s = rand(2, 7);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(16, 28), max: 28, color, size: rand(2.5, 5.5), grav: 0.25 });
  }
}

function lanePress(i, t) {
  laneDown[i] = true;
  if (state !== 'play') return;
  let hit = null;
  for (const n of notes) {
    if (n.lane !== i || n.state !== 'pending') continue;
    if (n.t - t > WIN.ok) break;
    if (Math.abs(t - n.t) <= WIN.ok) { hit = n; break; }
  }
  if (!hit) {
    if (streak > 0) { streak = 0; showJudge('PREZGODAJ', '#cfc6e8'); }
    clunk();
    return;
  }
  const err = Math.abs(t - hit.t);
  let pts, label, color;
  if (err <= WIN.perfect) { pts = 100; label = 'SUPER!'; color = '#ffd23f'; }
  else if (err <= WIN.good) { pts = 70; label = 'DOBRO'; color = '#c8ff6b'; }
  else { pts = 40; label = 'OK'; color = '#7af0ff'; }
  streak++;
  maxStreak = Math.max(maxStreak, streak);
  hits++;
  scoreF += pts * mult();
  showJudge(label, color);
  laneFlash[i] = 1;
  burst(i, PILL[i]);
  if (streak % 25 === 0) showBanner(`${streak} V NIZU!`, '#ffd23f');
  if (AC && !hit.freq) playTone(AC.currentTime, 1500 + i * 350, 0.05, 'sine', 0.035); // lastna pesem: le tih "tik"
  if (hit.hold) {
    hit.state = 'holding';
    hit.heldTo = Math.max(t, hit.t);
    if (AC && hit.freq) hit.voice = leadVoice(hit.freq);
  } else {
    hit.state = 'hit';
    if (AC && hit.freq) stopVoice(leadVoice(hit.freq), 0.14, 0.08);
  }
}

function laneRelease(i, t) {
  laneDown[i] = false;
  for (const n of notes) {
    if (n.lane === i && n.state === 'holding') {
      n.state = t >= n.t + n.dur - 0.12 ? 'done' : 'dropped';
      stopVoice(n.voice); n.voice = null;
    }
  }
}

function frameUpdate(t) {
  lastT = t;
  while (gen.bar < TOTAL && PHASE + gen.bar * BAR < t + 3.2) custom ? genBarCustom() : genBar();

  if (AC && clockOverride === null) {
    while (bIdx < backing.length && backing[bIdx].t < t + 0.3) {
      const ev = backing[bIdx++], at = songStart + ev.t;
      if (at >= AC.currentTime - 0.05) playEvent(ev, Math.max(at, AC.currentTime));
    }
  }

  for (const n of notes) {
    if (!n.spawned && t >= n.t - n.lead) {
      n.spawned = true;
      viewLead = n.lead;
      if (!n.hold) spit(); else sniff(n);
    }
    if (n.state === 'pending' && t > n.t + WIN.ok) {
      n.state = 'miss';
      misses++;
      registerMiss(t);
      showJudge('ZGREŠENO', '#ff5b5b');
    } else if (n.state === 'holding') {
      const end = n.t + n.dur, upTo = Math.min(t, end);
      if (upTo > n.heldTo) {
        scoreF += (upTo - n.heldTo) * HOLD_PTS * mult();
        n.heldTo = upTo;
      }
      laneFlash[n.lane] = Math.max(laneFlash[n.lane], 0.6);
      if (Math.random() < 0.4) burst(n.lane, TAIL, 1);
      if (t >= end) {
        n.state = 'done';
        stopVoice(n.voice); n.voice = null;
        burst(n.lane, '#fff', 10);
      }
    }
  }

  // nivoji po času pesmi — vsak gre skozi vse; injekcija se začne 1,3 s pred dropom
  let li = levelIdx;
  const lbars = activeLevelBars();
  if (lbars) {
    li = Math.max(levelIdx, levelForBar(Math.floor((t - PHASE) / BAR + 1e-6)));
    const tAfta = PHASE + lbars[AFTA_LEVEL] * BAR;
    if (!gen.aftaDone && t >= tAfta - 1.3) {
      gen.aftaDone = true;
      cut = { t0: tAfta - 1.3, squirted: false, crazy: false };
    }
  } else {
    while (li + 1 < LEVELS.length && scoreF >= LEVELS[li + 1].score) li++;
  }
  if (li > levelIdx) {
    const prev = levelIdx;
    levelIdx = li;
    if (prev < AFTA_LEVEL && li >= AFTA_LEVEL) {
      if (!gen.aftaDone) {
        gen.aftaDone = true;
        cut = { t0: t, squirted: false, crazy: false };
        gen.rest = 1;
      }
    } else {
      showBanner(`NIVO ${li + 1}! ${li >= 4 ? '🤯' : '🔥'}`, '#ff7ac8');
      if (AC) playNoise(AC.currentTime, 1, 0.15, 'highpass', 4500);
    }
    buzz(20);
  }

  // injekcija: zvoki ob pravem trenutku
  if (cut) {
    const ct = t - cut.t0;
    if (!cut.squirted && ct >= 0.7) {
      cut.squirted = true;
      if (AC) playNoise(AC.currentTime, 0.5, 0.3, 'bandpass', 2500);
    }
    if (!cut.crazy && ct >= 1.3) {
      cut.crazy = true;
      if (AC) {
        playNoise(AC.currentTime, 1.4, 0.2, 'highpass', 4500);
        [523, 659, 784, 1046, 1318].forEach((f, i) => playTone(AC.currentTime + i * 0.07, f, 0.25, 'square', 0.05));
      }
      buzz([40, 40, 80]);
    }
    if (ct > 4.5) cut = null;
  }

  if (t > SONG_END) finish();
}

// videz možička: med injekcijo ostane na nivoju 3, dokler voda ne pride v usta
function wastedLevel(t) {
  if (cut && t - cut.t0 < 1.3) return Math.min(levelIdx, AFTA_LEVEL - 1);
  return levelIdx;
}

function spit() {
  const y = L.HEAD_Y + 68 * L.HEAD_S;
  for (let i = 0; i < 4; i++) {
    particles.push({ x: L.CX + rand(-10, 10), y, vx: rand(-1.5, 1.5), vy: rand(0.5, 2.5), life: 18, max: 18, color: 'rgba(255,255,255,.8)', size: rand(2, 3.5), grav: 0.1 });
  }
}
function sniff(n) {
  const y = L.HEAD_Y + 35 * L.HEAD_S;
  const color = levelIdx >= AFTA_LEVEL ? 'rgba(255,77,94,.9)' : 'rgba(243,230,204,.9)';
  for (let i = 0; i < 6; i++) {
    particles.push({ x: L.CX + (n.lane - 1) * 12, y, vx: rand(-2, 2), vy: rand(0, 2), life: 22, max: 22, color, size: rand(2, 4), grav: 0.15 });
  }
}

// ---------------------------------------------------------------- vnos

addEventListener('keydown', e => {
  if (state === 'name') { if (e.code === 'Escape') closeNameModal(true); return; }
  if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  audioInit();
  if (e.code === 'KeyM') { setMuted(!muted); return; }
  if (state === 'play') {
    if (e.code === 'Escape' || e.code === 'KeyP') return pauseGame();
    if (e.code in KEYMAP) lanePress(KEYMAP[e.code], songTime());
  } else if (state === 'paused') {
    if (['Escape', 'KeyP', 'Enter', 'Space'].includes(e.code)) resumeGame();
  } else if (state === 'title' || state === 'results' || state === 'board') {
    if (e.code === 'Enter' || e.code === 'Space') openNameModal();
    if (e.code === 'Escape' && state !== 'title') state = 'title';
  }
});
addEventListener('keyup', e => {
  if (!(e.code in KEYMAP)) return;
  if (state === 'play') laneRelease(KEYMAP[e.code], songTime());
  else laneDown[KEYMAP[e.code]] = false;
});
addEventListener('blur', pauseGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
addEventListener('contextmenu', e => e.preventDefault());

// dotik: zaslon je razdeljen na tri stolpce (levo, sredina, desno)
const pointerLane = {};
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const { x, y } = toCanvas(e);
  for (const b of uiButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
  }
  if (state === 'play' && y > H * 0.28) {
    const lane = clamp(Math.floor(x / (W / 3)), 0, 2);
    pointerLane[e.pointerId] = lane;
    try { cv.setPointerCapture(e.pointerId); } catch { }
    lanePress(lane, songTime());
  }
});
const pointerUp = e => {
  const lane = pointerLane[e.pointerId];
  if (lane === undefined) return;
  delete pointerLane[e.pointerId];
  if (!Object.values(pointerLane).includes(lane)) laneRelease(lane, songTime());
};
cv.addEventListener('pointerup', pointerUp);
cv.addEventListener('pointercancel', pointerUp);

// ================================================================ RISANJE

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function bigText(str, x, y, size, fill, opts = {}) {
  ctx.font = `${size}px Bungee, Impact, sans-serif`;
  ctx.textAlign = opts.align || 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  if (opts.shadow !== false) { ctx.fillStyle = INK; ctx.fillText(str, x + size * 0.09, y + size * 0.09); }
  ctx.lineWidth = size * 0.16;
  ctx.strokeStyle = opts.stroke || INK;
  ctx.strokeText(str, x, y);
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
}
function txt(str, x, y, size, color, align = 'center') {
  ctx.font = `${size}px Bungee, Impact, sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
}
function button(label, x, y, w, h, action, color = '#ffd23f', textColor = INK) {
  rr(x + 5, y + 5, w, h, 16); ctx.fillStyle = INK; ctx.fill();
  rr(x, y, w, h, 16); ctx.fillStyle = color; ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  txt(label, x + w / 2, y + h / 2 + 1, Math.min(24, h * 0.4), textColor);
  uiButtons.push({ x, y, w, h, action });
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => clamp(Math.round(amt < 0 ? v * (1 + amt) : v + (255 - v) * amt), 0, 255);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

// ---------- ozadje

const STARS = Array.from({ length: 130 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.5, 1.8), p: rand(0, TAU) }));

function drawBackground(pulse) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12062e');
  g.addColorStop(0.6, '#3a1260');
  g.addColorStop(1, '#7a1f5c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  for (const s of STARS) {
    ctx.globalAlpha = 0.3 + 0.6 * Math.abs(Math.sin(frame * 0.03 + s.p));
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'lighter';
  for (const [x, c, dir] of [[W * 0.1, '255,122,200', 1], [W * 0.9, '122,240,255', -1]]) {
    ctx.save();
    ctx.translate(x, H);
    ctx.rotate(-0.35 * dir + Math.sin(frame * 0.012) * 0.25 * dir);
    const lg = ctx.createLinearGradient(0, 0, 0, -H);
    lg.addColorStop(0, `rgba(${c},${0.16 + pulse * 0.15})`);
    lg.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.moveTo(-20, 0); ctx.lineTo(20, 0); ctx.lineTo(130, -H); ctx.lineTo(-130, -H); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// nivo 4–5: psihedelično ozadje, ki utripa v ritmu
function drawTrippy(ex) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const strong = ex.level >= 4 ? 1 : 0.5;
  for (let i = 0; i < 3; i++) {
    const hue = (frame * 2 + i * 120) % 360;
    const x = W * (0.5 + 0.4 * Math.sin(frame * 0.01 + i * 2.1));
    const y = H * (0.4 + 0.3 * Math.cos(frame * 0.013 + i * 1.7));
    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(W, H) * 0.5);
    g.addColorStop(0, `hsla(${hue},100%,60%,${(0.1 + ex.pulse * 0.08) * strong})`);
    g.addColorStop(1, 'hsla(0,0%,0%,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }
  ctx.restore();
}

// ---------- proga

function drawHighway(t) {
  const zn = -0.12;
  ctx.beginPath();
  ctx.moveTo(L.CX - halfW(1), projY(1));
  ctx.lineTo(L.CX + halfW(1), projY(1));
  ctx.lineTo(L.CX + halfW(zn), projY(zn));
  ctx.lineTo(L.CX - halfW(zn), projY(zn));
  ctx.closePath();
  const g = ctx.createLinearGradient(0, L.FAR_Y, 0, L.HIT_Y);
  g.addColorStop(0, '#0e0a1c');
  g.addColorStop(1, '#2a2045');
  ctx.fillStyle = g;
  ctx.fill();

  // pritisnjeni stolpec zasveti
  for (let i = 0; i < 3; i++) {
    if (!laneDown[i]) continue;
    ctx.beginPath();
    ctx.moveTo(laneX(i, 1) - laneW(1) / 2, projY(1));
    ctx.lineTo(laneX(i, 1) + laneW(1) / 2, projY(1));
    ctx.lineTo(laneX(i, zn) + laneW(zn) / 2, projY(zn));
    ctx.lineTo(laneX(i, zn) - laneW(zn) / 2, projY(zn));
    ctx.closePath();
    const lg = ctx.createLinearGradient(0, L.FAR_Y, 0, L.HIT_Y);
    lg.addColorStop(0, 'rgba(255,255,255,0)');
    lg.addColorStop(1, PILL[i] + '44');
    ctx.fillStyle = lg;
    ctx.fill();
  }

  if (state !== 'title') {
    const k0 = Math.floor((t - PHASE) / BEAT), k1 = Math.ceil((t - PHASE + viewLead) / BEAT);
    for (let k = k0; k <= k1; k++) {
      const z = (PHASE + k * BEAT - t) / viewLead;
      if (z < 0 || z > 1) continue;
      const y = projY(z), hw = halfW(z);
      ctx.strokeStyle = k % 4 === 0 ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.12)';
      ctx.lineWidth = (k % 4 === 0 ? 3 : 1.5) * persp(z);
      ctx.beginPath(); ctx.moveTo(L.CX - hw, y); ctx.lineTo(L.CX + hw, y); ctx.stroke();
    }
  }

  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.lineWidth = 1.5;
  for (let i = 1; i < 3; i++) {
    const xf = L.CX - halfW(1) + i * laneW(1), xn = L.CX - halfW(zn) + i * laneW(zn);
    ctx.beginPath(); ctx.moveTo(xf, projY(1)); ctx.lineTo(xn, projY(zn)); ctx.stroke();
  }
  for (const s of [-1, 1]) {
    ctx.strokeStyle = s < 0 ? '#ff7ac8' : '#7af0ff';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(L.CX + s * halfW(1), projY(1)); ctx.lineTo(L.CX + s * halfW(zn), projY(zn)); ctx.stroke();
  }
}

// dolga črta: bež "nitka" iz nosu
function drawTail(n, t) {
  const holding = n.state === 'holding';
  const zs = holding ? 0 : (n.t - t) / n.lead;
  const ze = (n.t + n.dur - t) / n.lead;
  const z0 = Math.max(zs, holding ? 0 : -0.12), z1 = Math.min(ze, 1);
  if (z1 <= z0) return;
  const grey = n.state === 'dropped' || n.state === 'miss';
  const red = levelIdx >= AFTA_LEVEL;
  const fill = grey ? '#6b6480' : red ? (holding ? '#ff8a96' : '#ff4d5e') : holding ? '#fffaf0' : TAIL;
  const edge = grey ? 'rgba(27,16,54,.5)' : red ? '#8a1424' : 'rgba(150,120,80,.85)';

  // gladka črta: veliko odsekov, nežno valovanje, zaobljena konca
  const seg = 28, left = [], right = [], mid = [];
  for (let i = 0; i <= seg; i++) {
    const z = z0 + (z1 - z0) * (i / seg);
    const wob = holding ? Math.sin(z * 9 - frame * 0.18) * 1.6 * persp(z) : 0;
    const x = laneX(n.lane, z) + wob, y = projY(z), w = laneW(z) * 0.11;
    left.push([x - w, y]); right.push([x + w, y]); mid.push([x, y, w]);
  }
  const outline = () => {
    ctx.beginPath();
    ctx.moveTo(left[0][0], left[0][1]);
    for (let i = 1; i < left.length; i++) ctx.lineTo(left[i][0], left[i][1]);
    const e = mid[mid.length - 1];
    ctx.ellipse(e[0], e[1], e[2], e[2] * 0.5, 0, Math.PI, 0);
    for (let i = right.length - 1; i >= 0; i--) ctx.lineTo(right[i][0], right[i][1]);
    const s = mid[0];
    ctx.ellipse(s[0], s[1], s[2], s[2] * 0.5, 0, 0, Math.PI);
    ctx.closePath();
  };
  ctx.lineJoin = 'round';
  outline();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = edge; ctx.stroke();
  if (!grey) {
    ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < mid.length; i++) {
      const [x, y, w] = mid[i];
      i ? ctx.lineTo(x - w * 0.35, y) : ctx.moveTo(x - w * 0.35, y);
    }
    ctx.stroke();
  }
  if (holding) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.25;
    ctx.lineWidth = laneW(0) * 0.35;
    ctx.strokeStyle = PILL[n.lane];
    ctx.beginPath(); ctx.moveTo(left[0][0], left[0][1]); ctx.lineTo(laneX(n.lane, z1), projY(z1)); ctx.stroke();
    ctx.restore();
  }
}

function symbolPath(kind, s) {
  ctx.beginPath();
  if (kind === 'heart') {
    ctx.moveTo(0, s * 0.45);
    ctx.bezierCurveTo(-s * 1.15, -s * 0.3, -s * 0.5, -s * 1.0, 0, -s * 0.4);
    ctx.bezierCurveTo(s * 0.5, -s * 1.0, s * 1.15, -s * 0.3, 0, s * 0.45);
  } else if (kind === 'star') {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? s * 0.42 : s;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
  } else {
    ctx.arc(0, 0, s * 0.85, 0, TAU);
  }
  ctx.closePath();
}

// bonbonček: tableta z vtisnjenim simbolom
function drawPill(n, z, t) {
  const lane = n.lane, dim = n.state === 'miss' || n.state === 'dropped';
  const p = persp(z), x = laneX(lane, z), y = projY(z);
  const rx = laneW(z) * 0.34, ry = rx * 0.52, th = rx * 0.3;
  const col = dim ? '#77708c' : PILL[lane];

  ctx.beginPath(); ctx.ellipse(x, y + th + ry * 0.35, rx * 1.02, ry * 0.9, 0, 0, TAU);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fill();

  // rob tablete
  ctx.fillStyle = shade(col, -0.28);
  ctx.beginPath(); ctx.ellipse(x, y + th, rx, ry, 0, 0, Math.PI); ctx.lineTo(x - rx, y); ctx.ellipse(x, y, rx, ry, 0, Math.PI, 0, true); ctx.closePath(); ctx.fill();
  ctx.lineWidth = 2 * p + 0.5; ctx.strokeStyle = INK; ctx.stroke();

  // zgornja ploskev
  const fg = ctx.createLinearGradient(x - rx, y - ry, x + rx, y + ry);
  fg.addColorStop(0, shade(col, 0.35));
  fg.addColorStop(1, col);
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  ctx.fillStyle = fg; ctx.fill();
  ctx.stroke();
  ctx.beginPath(); ctx.ellipse(x, y, rx * 0.84, ry * 0.84, 0, 0, TAU);
  ctx.lineWidth = 1.5 * p + 0.3; ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.stroke();

  // vtisnjen simbol
  const kind = SYMBOLS[lane], sz = rx * 0.58;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1, ry / rx);
  ctx.rotate(n.spin + t * 1.2);
  ctx.translate(sz * 0.08, sz * 0.08);
  symbolPath(kind, sz);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.translate(-sz * 0.16, -sz * 0.16);
  symbolPath(kind, sz);
  ctx.fillStyle = shade(col, -0.22); ctx.fill();
  if (kind === 'smile') {
    ctx.fillStyle = shade(col, 0.4);
    ctx.beginPath(); ctx.arc(-sz * 0.3, -sz * 0.2, sz * 0.13, 0, TAU); ctx.arc(sz * 0.3, -sz * 0.2, sz * 0.13, 0, TAU); ctx.fill();
    ctx.lineWidth = sz * 0.14; ctx.strokeStyle = shade(col, 0.4); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(0, sz * 0.05, sz * 0.45, 0.25 * Math.PI, 0.75 * Math.PI); ctx.stroke();
  }
  ctx.restore();

  // lesk
  ctx.beginPath(); ctx.ellipse(x - rx * 0.42, y - ry * 0.38, rx * 0.22, ry * 0.16, -0.4, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fill();
}

function drawFrets() {
  for (let i = 0; i < 3; i++) {
    const x = laneX(i, 0), rx = laneW(0) * 0.38, ry = rx * 0.45;
    const on = laneDown[i], fl = laneFlash[i];
    ctx.beginPath(); ctx.ellipse(x, L.HIT_Y + 5, rx + 5, ry + 5, 0, 0, TAU);
    ctx.fillStyle = INK; ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, L.HIT_Y, rx, ry, 0, 0, TAU);
    ctx.fillStyle = on ? PILL[i] : '#1a1430'; ctx.fill();
    ctx.lineWidth = 7; ctx.strokeStyle = PILL[i]; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, L.HIT_Y - 2, rx * 0.55, ry * 0.5, 0, 0, TAU);
    ctx.fillStyle = on ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.1)'; ctx.fill();
    if (fl > 0) {
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(x, L.HIT_Y - 10, 2, x, L.HIT_Y - 10, rx * 1.4);
      g.addColorStop(0, `rgba(255,255,255,${0.7 * fl})`);
      g.addColorStop(0.4, PILL[i]);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.globalAlpha = fl;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(x, L.HIT_Y - 20, rx * 1.3, rx * 1.4, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    if (!IS_TOUCH) txt(LANE_KEYS[i], x, L.HIT_Y + ry + 30, 16, on ? '#fff' : 'rgba(255,255,255,.55)');
  }
}

// ---------- glava

// nos v slogu Nosferatuja (pogled od spredaj), pomanjšan na glavo
function nosePath() {
  ctx.beginPath();
  ctx.moveTo(-32, -290);
  ctx.quadraticCurveTo(0, -306, 32, -290);
  ctx.bezierCurveTo(40, -220, 55, -170, 70, -140);
  ctx.bezierCurveTo(132, -128, 136, -40, 90, -28);
  ctx.bezierCurveTo(60, -20, 30, -28, 0, -26);
  ctx.bezierCurveTo(-30, -28, -60, -20, -90, -28);
  ctx.bezierCurveTo(-136, -40, -132, -128, -70, -140);
  ctx.bezierCurveTo(-55, -170, -40, -220, -32, -290);
  ctx.closePath();
}

function drawNose(fl, lv) {
  const red = fl > 0.1 || lv >= AFTA_LEVEL;
  ctx.save();
  ctx.translate(0, 48);
  ctx.scale(0.3 * (1 + fl * 0.08), 0.3);
  const g = ctx.createRadialGradient(-30, -160, 20, 0, -130, 230);
  g.addColorStop(0, '#ffdcc4');
  g.addColorStop(1, red ? '#e0765c' : '#eaa27c');
  nosePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = 14; ctx.strokeStyle = INK; ctx.stroke();
  // konica
  const tg = ctx.createRadialGradient(-18, -112, 8, 0, -92, 70);
  tg.addColorStop(0, red ? '#ff8a8a' : '#ffd4b8');
  tg.addColorStop(1, red ? '#d9434f' : '#f0a07a');
  ctx.beginPath(); ctx.arc(0, -92, 64, 0, TAU);
  ctx.fillStyle = tg; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -92, 64, Math.PI * 1.08, Math.PI * 1.92);
  ctx.lineWidth = 9; ctx.strokeStyle = 'rgba(27,16,54,.5)'; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-22, -120, 15, 24, -0.4, 0, TAU);
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
  // pore
  ctx.fillStyle = 'rgba(120,50,30,.35)';
  for (const [x, y] of [[-30, -70], [25, -80], [10, -60], [-12, -150], [35, -110]]) {
    ctx.beginPath(); ctx.arc(x, y, 5, 0, TAU); ctx.fill();
  }
  // nosnice
  const ns = 1 + fl * 0.35;
  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * 40, -44, 22 * ns, 12 * ns, -sx * 0.35, 0, TAU);
    ctx.fillStyle = '#3a1220'; ctx.fill();
  }
  // dlake
  ctx.strokeStyle = '#2a1530'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const nx = sx * (32 + i * 8);
      ctx.beginPath(); ctx.moveTo(nx, -38); ctx.lineTo(nx + sx * (3 + i * 2), -24 + (i % 2) * 6); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawEyes(ex) {
  const lv = ex.level;
  for (const sx of [-1, 1]) {
    const x = sx * 34, y = -30;
    // po vodici (nivo 4+) oči ostanejo odprte s spiralo, tudi ko se smeje
    if (ex.laugh && lv < AFTA_LEVEL) {
      ctx.lineWidth = 5; ctx.strokeStyle = INK;
      ctx.beginPath(); ctx.arc(x, y + 6, 13, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
      continue;
    }
    // beločnica: od nivoja 3 rdeča, s žilicami
    ctx.beginPath(); ctx.ellipse(x, y, 17, 19, 0, 0, TAU);
    ctx.fillStyle = lv >= 2 ? '#ffc4c4' : '#fff'; ctx.fill();
    if (lv >= 2) {
      ctx.save();
      ctx.beginPath(); ctx.ellipse(x, y, 17, 19, 0, 0, TAU); ctx.clip();
      ctx.strokeStyle = 'rgba(220,20,40,.85)'; ctx.lineWidth = 1.4;
      for (let i = 0; i < 7; i++) {
        const a = i * 0.9 + sx;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * 18, y + Math.sin(a) * 20);
        ctx.quadraticCurveTo(x + Math.cos(a + 0.3) * 12, y + Math.sin(a + 0.3) * 13, x + Math.cos(a + 0.1) * 8, y + Math.sin(a + 0.1) * 9);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,40,60,.18)';
      ctx.fillRect(x - 20, y - 22, 40, 44);
      ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(x, y, 17, 19, 0, 0, TAU);
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();

    const px = x + ex.lookX * (lv >= 3 ? 1 : 5), py = y + (lv >= 3 ? 0 : 5);
    if (lv >= 3) {
      // čarobne oči: mavrična spirala
      const spd = lv >= 4 ? 0.32 : 0.18;
      ctx.lineWidth = lv >= 4 ? 2.6 : 2.2; ctx.lineCap = 'round';
      let prev = null;
      for (let a = 0; a < 14; a += 0.25) {
        const r = a * 1.05, ang = a * sx + frame * spd * sx;
        const p = [px + Math.cos(ang) * r, py + Math.sin(ang) * r * 1.08];
        if (prev) {
          ctx.strokeStyle = lv >= 4 ? `hsl(${(a * 40 + frame * 6) % 360},100%,55%)` : (a | 0) % 2 ? INK : '#ff4dd2';
          ctx.beginPath(); ctx.moveTo(prev[0], prev[1]); ctx.lineTo(p[0], p[1]); ctx.stroke();
        }
        prev = p;
      }
    } else {
      // nivo 2+: velike črne zenice
      const pr = lv >= 1 ? 12.5 : 7.5;
      ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU);
      ctx.fillStyle = INK; ctx.fill();
      ctx.beginPath(); ctx.arc(px - pr * 0.35, py - pr * 0.4, lv >= 1 ? 2.2 : 2.5, 0, TAU);
      ctx.fillStyle = '#fff'; ctx.fill();
    }

    // obrvi
    ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.strokeStyle = INK;
    ctx.beginPath();
    if (lv >= 4) { const w = Math.sin(frame * 0.3 + sx) * 5; ctx.moveTo(x - sx * 14, y - 36 + w); ctx.lineTo(x + sx * 14, y - 40 - w); }
    else if (ex.worried || lv >= 2) { ctx.moveTo(x - sx * 16, y - 26); ctx.lineTo(x + sx * 12, y - 36); }
    else { ctx.moveTo(x - sx * 14, y - 32); ctx.lineTo(x + sx * 14, y - 28); }
    ctx.stroke();
  }
}

const SWEAT = [[70, -46], [-68, -36], [58, 12], [-62, 18], [6, -82]];
const SWEAT_BY_LEVEL = [0, 1, 3, 4, 5];

function drawHead(cx, cy, s, ex) {
  const lv = ex.level;
  const shake = (lv >= 4 ? 4 : lv >= 3 ? 2 : 0) + (ex.crazy || 0) * 9;
  ctx.save();
  ctx.translate(cx + (shake ? rand(-shake, shake) : 0), cy + (shake ? rand(-shake, shake) * 0.6 : 0));
  if (lv >= 4 || ex.crazy) ctx.rotate(Math.sin(frame * 0.12) * 0.06 + (ex.crazy || 0) * Math.sin(frame * 0.9) * 0.15);
  ctx.scale(s * (1 + 0.035 * ex.pulse), s * (1 - 0.02 * ex.pulse));
  const skin = lv >= 3 ? '#f7b89a' : '#f9c6a5';

  for (const sx of [-1, 1]) {
    ctx.beginPath(); ctx.ellipse(sx * 88, 4, 18, 28, 0, 0, TAU);
    ctx.fillStyle = skin; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  }
  const fg = ctx.createRadialGradient(-25, -30, 10, 0, 0, 110);
  fg.addColorStop(0, lv >= 3 ? '#ffd6c6' : '#ffe0cc');
  fg.addColorStop(1, lv >= 3 ? '#e48a72' : '#eba07c');
  ctx.beginPath(); ctx.ellipse(0, 0, 86, 92, 0, 0, TAU);
  ctx.fillStyle = fg; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  ctx.fillStyle = lv >= 2 ? 'rgba(255,60,90,.4)' : 'rgba(255,90,120,.28)';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.ellipse(sx * 54, 30, 16, 10, 0, 0, TAU); ctx.fill(); }

  // novoletna kapica
  ctx.save();
  ctx.translate(40, -68);
  ctx.rotate(0.62 + (lv >= 4 ? Math.sin(frame * 0.2) * 0.15 : 0));
  ctx.beginPath(); ctx.moveTo(-30, 6); ctx.lineTo(30, 6); ctx.lineTo(0, -62); ctx.closePath();
  ctx.fillStyle = '#ff7ac8'; ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = '#ffd23f';
  for (let i = -3; i < 6; i++) { ctx.beginPath(); ctx.moveTo(-60, i * 18); ctx.lineTo(60, i * 18 - 30); ctx.lineTo(60, i * 18 - 22); ctx.lineTo(-60, i * 18 + 8); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  ctx.beginPath(); ctx.moveTo(-30, 6); ctx.lineTo(30, 6); ctx.lineTo(0, -62); ctx.closePath();
  ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
  ctx.beginPath(); ctx.arc(0, -66, 9 + ex.pulse * 2, 0, TAU);
  ctx.fillStyle = '#7af0ff'; ctx.fill(); ctx.stroke();
  ctx.restore();

  drawEyes(ex);
  drawNose(ex.flare, lv);

  // USTA — za bonbončke
  const o = ex.laugh ? 1 : Math.max(ex.open, ex.gulp || 0);
  if (o > 0.05) {
    ctx.beginPath(); ctx.ellipse(0, 68, 26 + o * 10, 5 + o * 17, 0, 0, TAU);
    ctx.fillStyle = '#5a0f1f'; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.save();
    ctx.beginPath(); ctx.ellipse(0, 68, 26 + o * 10, 5 + o * 17, 0, 0, TAU); ctx.clip();
    ctx.fillStyle = '#fff'; ctx.fillRect(-24, 68 - 5 - o * 17, 48, 7);
    ctx.fillStyle = '#ff7a9a'; ctx.beginPath(); ctx.ellipse(0, 68 + o * 15, 16, 9, 0, 0, TAU); ctx.fill();
    ctx.restore();
  } else if (lv >= 4) {
    // nivo 5: jezik ven, nasmeh do ušes
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-34, 60); ctx.quadraticCurveTo(0, 86, 34, 60); ctx.stroke();
    const tw = Math.sin(frame * 0.25) * 3;
    ctx.beginPath(); ctx.ellipse(8 + tw, 82, 11, 15, 0.2, 0, TAU);
    ctx.fillStyle = '#ff7a9a'; ctx.fill(); ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8 + tw, 72); ctx.lineTo(8 + tw, 88); ctx.lineWidth = 2; ctx.strokeStyle = '#c84a6a'; ctx.stroke();
  } else if (lv >= 2) {
    // škripanje z zobmi
    ctx.fillStyle = '#fff';
    rr(-26, 60, 52, 14, 6); ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = 1.5;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 9, 60); ctx.lineTo(i * 9, 74); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(-26, 67); ctx.lineTo(26, 67); ctx.stroke();
  } else {
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-24, 64); ctx.quadraticCurveTo(0, 80, 24, 64); ctx.stroke();
  }

  // pot
  const drops = Math.max(SWEAT_BY_LEVEL[lv] || 0, ex.worried ? 1 : 0);
  for (let i = 0; i < drops; i++) {
    const [sx, sy] = SWEAT[i];
    const fall = (frame * (1 + i * 0.25) + i * 23) % 50;
    ctx.globalAlpha = 1 - fall / 60;
    ctx.beginPath();
    ctx.moveTo(sx, sy + fall - 9);
    ctx.quadraticCurveTo(sx + 6, sy + fall + 2, sx, sy + fall + 6);
    ctx.quadraticCurveTo(sx - 6, sy + fall + 2, sx, sy + fall - 9);
    ctx.fillStyle = 'rgba(140,210,255,.95)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(27,16,54,.6)'; ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (ex.laugh) {
    const wob = Math.sin(frame * 0.6) * 3;
    bigText('HA HA!', cx + 140 * s, cy - 50 * s + wob, 24 * s, '#ffd23f', { shadow: false });
  }
}

// ---------- injekcija (prehod v nivo 4)

function drawSyringe(t) {
  if (!cut) return;
  const ct = t - cut.t0;
  if (ct > 1.8) return;
  const S = L.HEAD_S;
  const mx = L.CX + 18 * S, my = L.HEAD_Y + 68 * S; // usta
  // 0–0.6 prileti, 0.6–1.2 špricne, 1.2–1.8 odleti
  const inT = clamp(ct / 0.6, 0, 1), outT = clamp((ct - 1.2) / 0.6, 0, 1);
  const ease = k => 1 - Math.pow(1 - k, 3);
  const push = clamp((ct - 0.6) / 0.6, 0, 1);
  const off = (1 - ease(inT)) * 320 + ease(outT) * 360;
  const len = 170 * S, wid = 34 * S;

  ctx.save();
  ctx.translate(mx + off, my - off * 0.35);
  ctx.rotate(-0.32);
  // konica (plastična, brez igle)
  ctx.fillStyle = 'rgba(235,245,255,.9)';
  ctx.strokeStyle = INK; ctx.lineWidth = 3;
  rr(0, -6 * S, 22 * S, 12 * S, 4); ctx.fill(); ctx.stroke();
  // cilinder
  const bx = 22 * S;
  rr(bx, -wid / 2, len, wid, 8); ctx.fillStyle = 'rgba(230,245,255,.55)'; ctx.fill(); ctx.stroke();
  // voda
  const water = (1 - push) * (len - 16 * S);
  if (water > 1) {
    ctx.fillStyle = 'rgba(90,190,255,.75)';
    ctx.fillRect(bx + 3, -wid / 2 + 4, water, wid - 8);
  }
  // ml oznake
  ctx.strokeStyle = 'rgba(27,16,54,.75)'; ctx.lineWidth = 1.5;
  ctx.fillStyle = INK; ctx.font = `${Math.round(9 * S)}px Bungee, Impact, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (let i = 0; i <= 10; i++) {
    const x = bx + 8 * S + i * (len - 22 * S) / 10;
    ctx.beginPath(); ctx.moveTo(x, -wid / 2); ctx.lineTo(x, -wid / 2 + (i % 2 ? 6 : 11) * S); ctx.stroke();
    if (i % 2 === 0) ctx.fillText(String(i / 2), x, -wid / 2 + 12 * S);
  }
  ctx.fillText('ml', bx + len - 10 * S, wid / 2 - 12 * S);
  // bat
  const px = bx + 6 + water;
  ctx.fillStyle = '#ff7ac8'; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.fillRect(px, -wid / 2 + 3, 8 * S, wid - 6); ctx.strokeRect(px, -wid / 2 + 3, 8 * S, wid - 6);
  ctx.fillStyle = 'rgba(230,245,255,.9)';
  ctx.fillRect(px + 8 * S, -5 * S, len + 30 * S - (px - bx), 10 * S); ctx.strokeRect(px + 8 * S, -5 * S, len + 30 * S - (px - bx), 10 * S);
  const thumb = px + len + 38 * S - (px - bx);
  rr(thumb, -wid / 2 - 6 * S, 10 * S, wid + 12 * S, 4); ctx.fillStyle = '#ff7ac8'; ctx.fill(); ctx.stroke();
  // krilca
  rr(bx + len - 4, -wid / 2 - 12 * S, 8 * S, wid + 24 * S, 3); ctx.fillStyle = 'rgba(230,245,255,.9)'; ctx.fill(); ctx.stroke();
  ctx.restore();

  // curek vode v usta
  if (ct >= 0.6 && ct < 1.2) {
    for (let i = 0; i < 3; i++) {
      particles.push({ x: mx + rand(-4, 4), y: my + rand(-3, 3), vx: rand(-3.5, -1.5), vy: rand(-0.5, 1), life: 10, max: 10, color: 'rgba(120,200,255,.95)', size: rand(2.5, 4.5), grav: 0.05 });
    }
  }
}

function drawAftaParty(t) {
  if (!cut) return;
  const ct = t - cut.t0;
  if (ct < 1.3 || ct > 4.5) return;
  const k = ct - 1.3;
  const alpha = Math.min(1, k * 4, (4.5 - ct) * 2);
  const pop = k < 0.25 ? 0.4 + k / 0.25 * 0.8 : 1.2 - Math.min(0.2, (k - 0.25) * 0.4);
  const y = L.portrait ? L.FAR_Y + 160 : 290;
  const lines = L.portrait ? ['AFTA PARTY', 'MOTHAFOKA'] : ['AFTA PARTY MOTHAFOKA'];
  const size = (L.portrait ? 50 : 48) * pop;
  ctx.globalAlpha = alpha;
  lines.forEach((line, li) => {
    ctx.font = `${size}px Bungee, Impact, sans-serif`;
    const total = ctx.measureText(line).width;
    let x = L.CX - total / 2;
    const ly = y + li * size * 1.1;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i], w = ctx.measureText(ch).width;
      const wob = Math.sin(frame * 0.3 + i * 0.6 + li) * 6;
      bigText(ch, x + w / 2, ly + wob, size, `hsl(${(i * 28 + frame * 8) % 360},100%,62%)`, { shadow: true });
      x += w;
    }
  });
  ctx.globalAlpha = 1;
}

function headExpr(t) {
  const beatPh = (((t - PHASE) % BEAT) + BEAT) % BEAT / BEAT;
  let open = 0, flare = 0;
  for (const n of notes) {
    const s = n.t - n.lead;
    if (s > t + 0.2) break;
    if (!n.hold) open = Math.max(open, 1 - Math.abs(t - s - 0.03) / 0.12);
    else if (t >= s - 0.1 && t <= s + n.dur) flare = Math.max(flare, t < s ? 1 - (s - t) / 0.1 : 1);
  }
  let gulp = 0, crazy = 0;
  if (cut) {
    const ct = t - cut.t0;
    if (ct > 0.45 && ct < 1.3) gulp = 1;                      // usta odprta za vodo
    if (ct >= 1.3 && ct < 3) crazy = 1 - (ct - 1.3) / 1.7;     // ponori
  }
  return {
    open: clamp(open, 0, 1), flare: clamp(flare, 0, 1), laugh: t < laughUntil && !gulp,
    worried: streak >= 25, pulse: Math.exp(-beatPh * 5), lookX: Math.sin(t * 1.3) * 0.6,
    level: wastedLevel(t), gulp, crazy,
  };
}

function drawSnot(t) {
  const ny = L.HEAD_Y + 36 * L.HEAD_S;
  const red = levelIdx >= AFTA_LEVEL;
  for (const n of notes) {
    if (!n.hold) continue;
    const s = n.t - n.lead;
    if (s > t) break;
    if (t > s + n.dur) continue;
    const nx = L.CX + (n.lane - 1) * 11 * L.HEAD_S;
    const tx = laneX(n.lane, 1), ty = L.FAR_Y + 2;
    const wob = Math.sin(frame * 0.3 + n.lane) * 6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(nx, ny); ctx.quadraticCurveTo((nx + tx) / 2 + wob, ny + 40, tx, ty);
    ctx.lineWidth = 9; ctx.strokeStyle = red ? '#8a1424' : 'rgba(150,120,80,.9)'; ctx.stroke();
    ctx.lineWidth = 5; ctx.strokeStyle = red ? '#ff4d5e' : TAIL; ctx.stroke();
  }
}

function drawStar(x, y, r, fill) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, r2 = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2);
  }
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
}

function hudBox(x, y, w, h) {
  rr(x, y, w, h, 12); ctx.fillStyle = 'rgba(27,16,54,.85)'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.stroke();
}

  drawStar(sb.x + sb.w - 26, sb.y + sb.h / 2, 22 + (m > 1 ? Math.sin(frame * 0.2) * 2 : 0),
    m === 4 ? '#7af0ff' : m === 3 ? '#ff7ac8' : m === 2 ? '#c8ff6b' : '#ffd23f');

  if (judge) {
    const age = performance.now() - judge.at;
    if (age < 550) {
      const s = age < 80 ? 0.7 + age / 80 * 0.4 : 1.1 - Math.min(0.1, (age - 80) / 800);
      ctx.globalAlpha = Math.min(1, (550 - age) / 150);
      bigText(judge.text, L.CX, jy, 34 * s, judge.color, { shadow: false });
      ctx.globalAlpha = 1;

  if (banner) {
    const age = performance.now() - banner.at;

      bigText(banner.text, L.CX, jy - 44 - age * 0.02, 30, banner.color);
      ctx.globalAlpha = 1;

  if (state !== 'play') return;
  rr(14, 14, 50, 44, 12); ctx.fillStyle = 'rgba(27,16,54,.7)'; ctx.fill();
  txt('II', 39, 37, 17, '#fff');
  uiButtons.push({ x: 4, y: 4, w: 70, h: 64, action: pauseGame });

function drawHUDBanner() {

function drawCountdown(t) {
  const y = L.portrait ? L.HIT_Y - 260 : 300;

  } else if (t < FIRST_NOTE) {
    const left = Math.ceil((FIRST_NOTE - t) / BEAT);
    if (left >= 1 && left <= 3) bigText(String(left), L.CX, y, 70, '#ffd23f');
  } else if (t < FIRST_NOTE + 0.6) {
    bigText('GREMO!', L.CX, y, 54, '#ff7ac8');
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU);
    ctx.fillStyle = p.color; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function openNameModal() {
  if (!custom && !TEST_VERSION) return;
  audioInit();
  state = 'name';
  nameInput.value = '';
  nameErr.textContent = '';
  nameModal.hidden = false;
  setTimeout(() => nameInput.focus(), 50);
}
function closeNameModal(cancel) {
  nameModal.hidden = true;
  nameInput.blur();
  if (cancel) state = 'title';
}
nameForm.addEventListener('submit', e => {
  e.preventDefault();
  const n = nameInput.value.trim().replace(/\s+/g, ' ');
  if (n.length < 2) { nameErr.textContent = 'Vpiši ime (vsaj 2 znaka).'; return; }
  playerName = n.slice(0, 20);
  closeNameModal(false);
  uiBeep(880);
  startSong();
});
document.getElementById('nameCancel').addEventListener('click', () => closeNameModal(true));

// testna verzija nima strežnika: lestvica živi samo v tem brskalniku
const LOCAL_BOARD = 'glavaHeroTestBoard';
function localBoardAll() {
  try { return JSON.parse(localStorage.getItem(LOCAL_BOARD)) || []; } catch { return []; }
}
function rankBoard(all) {
  const seen = new Set();
  return all.slice().sort((a, b) => b.score - a.score).filter(r => {
    const k = r.name.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

async function submitScore() {
  const entry = {
    name: playerName, score: Math.floor(scoreF), level: levelIdx + 1,
    hits, total: notes.length, maxStreak,
  };
  submitState = { status: 'saving' };
  if (TEST_VERSION) {
    const all = localBoardAll();
    const prevBest = Math.max(0, ...all.filter(r => r.name.toLowerCase() === entry.name.toLowerCase()).map(r => r.score));
    all.push({ ...entry, acc: entry.total ? Math.round(entry.hits / entry.total * 100) : 0, streak: entry.maxStreak });
    try { localStorage.setItem(LOCAL_BOARD, JSON.stringify(all.slice(-200))); } catch { }
    const top = rankBoard(all);
    board.top = top.slice(0, 20);
    submitState = { status: 'ok', rank: top.findIndex(r => r.name.toLowerCase() === entry.name.toLowerCase()) + 1, isBest: entry.score > prevBest };
    return;
  }
  try {
    const res = await fetch(API + '?a=score', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry),
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || 'Rezultata ni bilo mogoče shraniti.');
    submitState = { status: 'ok', rank: d.rank, isBest: d.isBest };
    board.top = d.top;
  } catch (e) {
    submitState = { status: 'error', msg: e.message === 'Failed to fetch' ? 'Ni povezave s strežnikom.' : e.message };
  }
}

async function openBoard() {
  uiBeep();
  state = 'board';
  board.loading = true;
  board.error = null;
  if (TEST_VERSION) {
    board.top = rankBoard(localBoardAll()).slice(0, 20);
    board.loading = false;
    return;
  }
  try {
    const res = await fetch(API + '?a=leaderboard', { cache: 'no-store' });
    const d = await res.json();
    board.top = d.top || [];
  } catch {
    board.error = 'Lestvice ni bilo mogoče naložiti.';
  }
  board.loading = false;
}

function drawBoard() {
  const P = L.portrait;
  const w = Math.min(520, W - 32), h = Math.min(P ? 760 : 500, H - 40), x = (W - w) / 2, y = (H - h) / 2;
  rr(x + 10, y + 10, w, h, 26); ctx.fillStyle = INK; ctx.fill();
  rr(x, y, w, h, 26); ctx.fillStyle = '#fff7d6'; ctx.fill();
  ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.stroke();
  bigText('🏆 LESTVICA', L.CX, y + 46, 34, '#ffd23f');
  txt('Nagradna igra · Glava Hero', L.CX, y + 82, 13, '#7b2ff7');

  const listTop = y + 108, rowH = 38, maxRows = Math.max(3, Math.floor((h - 108 - 96) / rowH));
  if (board.loading) txt('Nalagam …', L.CX, listTop + 60, 16, INK);
  else if (board.error) txt(board.error, L.CX, listTop + 60, 14, '#d1004f');
  else if (!board.top || !board.top.length) {
    txt('Še nihče ni igral.', L.CX, listTop + 50, 16, INK);
    txt('Bodi prvi! 🎤', L.CX, listTop + 80, 16, '#ff7ac8');
  } else {
    board.top.slice(0, maxRows).forEach((r, i) => {
      const ry = listTop + i * rowH;
      const me = playerName && r.name.toLowerCase() === playerName.toLowerCase();
      rr(x + 16, ry, w - 32, rowH - 6, 10);
      ctx.fillStyle = me ? '#c8ff6b' : i % 2 ? 'rgba(27,16,54,.05)' : 'rgba(255,122,200,.14)';
      ctx.fill();
      const cy = ry + (rowH - 6) / 2 + 1;
      txt(i < 3 ? ['🥇', '🥈', '🥉'][i] : `${i + 1}.`, x + 46, cy, i < 3 ? 20 : 15, INK);
      let name = r.name;
      ctx.font = '15px Bungee, Impact, sans-serif';
      while (name.length > 3 && ctx.measureText(name).width > w * 0.42) name = name.slice(0, -2);
      if (name !== r.name) name += '…';
      txt(name, x + 72, cy, 15, INK, 'left');
      txt(`niv. ${r.level} · ${r.acc} %`, x + w * 0.66, cy, 11, '#7b2ff7');
      txt(Number(r.score).toLocaleString('sl-SI'), x + w - 30, cy, 16, INK, 'right');
    });
  }
  const bw = (w - 60) / 2, by = y + h - 76;
  button('IGRAJ ▶', x + 20, by, bw, 56, openNameModal, '#ffd23f');
  button('NAZAJ', x + 40 + bw, by, bw, 56, () => { uiBeep(); state = 'title'; }, '#7af0ff');
}

// ---------------------------------------------------------------- zanka

function render() {
  frame++;
  uiButtons = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  let t = 0;
  if (state === 'play') { t = songTime(); frameUpdate(t); }
  else if (state === 'paused' || state === 'results') t = lastT;

  for (const p of particles) { p.life--; p.x += p.vx; p.y += p.vy; p.vy += p.grav; }
  particles = particles.filter(p => p.life > 0);
  for (let i = 0; i < 3; i++) laneFlash[i] = Math.max(0, laneFlash[i] - 0.06);

  const ex = ['title', 'loading', 'name', 'board'].includes(state) ? null : headExpr(t);
  drawBackground(ex ? ex.pulse : Math.exp(-((performance.now() / 1000 % BEAT) / BEAT) * 5));
  if (ex && ex.level >= 3) drawTrippy(ex);

  if (state === 'loading') {
    drawLoading();
  } else if (state === 'title' || state === 'name') {
    drawTitle();
    drawHUDBanner();
  } else if (state === 'board') {
    drawBoard();
  } else {
    drawHighway(t);
    drawHead(L.CX, L.HEAD_Y, L.HEAD_S, ex);
    drawSyringe(t);
    for (const n of notes) {
      if (!n.hold || n.state === 'done') continue;
      if ((n.t - t) / n.lead > 1.05) break;
      drawTail(n, t);
    }
    const vis = [];
    for (const n of notes) {
      const z = (n.t - t) / n.lead;
      if (n.t - n.lead > t + 0.05) break;
      if (z > 1.02 || z < -0.14 || n.state === 'hit' || n.state === 'holding' || n.state === 'done') continue;
      vis.push([n, z]);
    }
    vis.sort((a, b) => b[1] - a[1]);
    for (const [n, z] of vis) drawPill(n, z, t);
    drawSnot(t);
    drawFrets();
    drawParticles();
    drawHUD();
    drawAftaParty(t);
    if (state === 'play') drawCountdown(t);
    if (state === 'paused') drawPaused();
    if (state === 'results') drawResults();
  }
  if (state !== 'play') drawMute();
}

function loop() {
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (!TEST_VERSION) loadDefaultSong();
